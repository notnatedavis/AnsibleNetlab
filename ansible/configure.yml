#   ansible/configure.yml

---
- name: Configure FRR routers
  hosts: routers
  gather_facts: false

  tasks:
    - name: Wait for FRR container to accept connections
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Enable ospfd daemon
      ansible.builtin.lineinfile:
        path: /etc/frr/daemons
        regexp: '^ospfd='
        line: 'ospfd=yes'
      notify: Restart FRR

    - name: Enable staticd daemon
      ansible.builtin.lineinfile:
        path: /etc/frr/daemons
        regexp: '^staticd='
        line: 'staticd=yes'
      notify: Restart FRR

    - name: Render and push frr.conf
      ansible.builtin.template:
        src: templates/frr.conf.j2
        dest: /etc/frr/frr.conf
        mode: "0640"
      notify: Restart FRR

  handlers:
    - name: Restart FRR
      ansible.builtin.command: service frr restart
      changed_when: true

- name: Configure Alpine hosts
  hosts: hosts
  gather_facts: false

  tasks:
    - name: Ensure ifupdown-ng is installed
      ansible.builtin.raw: apk add --no-cache ifupdown-ng
      changed_when: false

    - name: Render and push interfaces file
      ansible.builtin.template:
        src: templates/host-interfaces.j2
        dest: /etc/network/interfaces
        mode: "0644"

    - name: Bring up eth1
      ansible.builtin.command: ifup eth1
      changed_when: true